name: Kompilacja KaM Remake

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Pobranie kodu źródłowego
      uses: actions/checkout@v4

    - name: Pobranie i instalacja kompilatora Free Pascal
      shell: powershell
      run: |
        Invoke-WebRequest -Uri "https://sourceforge.net" -OutFile "fpc.zip"
        Expand-Archive -Path "fpc.zip" -DestinationPath "C:\fpc"
        echo "C:\fpc\fpc\bin\i386-win32" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Kompilacja pliku wykonywalnego
      run: |
        cd src
        fpc -Mdelphi -O3 -Sg -Si KaM_Remake.dpr

    - name: Zapisanie gotowego pliku .exe do pobrania
      uses: actions/upload-artifact@v4
      with:
        name: Moj_Czysty_Plik_Gry
        path: src/KaM_Remake.exe
