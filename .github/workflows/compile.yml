name: Kompilacja KaM Remake

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Pobranie kodu źródłowego
        uses: actions/checkout@v4

      - name: Instalacja kompilatora Free Pascal (FPC)
        uses: cwbudde/action-fpc-lazarus@v1
        with:
          fpc-version: '3.2.2'
          lazarus-version: 'dist' # Pobiera tylko stabilne FPC bez instalowania pełnego środowiska Lazarus IDE

      - name: Kompilacja pliku wykonywalnego
        run: |
          cd src
          fpc -Mdelphi -O3 -Sg -Si KaM_Remake.dpr

      - name: Zapisanie gotowego pliku .exe do pobrania
        uses: actions/upload-artifact@v4
        with:
          name: Moj_Czysty_Plik_Gry
          path: src/KaM_Remake.exe
